<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CS180 Portfolio</title>
  <style>
    :root {
      --ink: #163b44;
      --muted: #5b8a94;
      --bg: #eef8fa;
      --card: #ffffff;
      --border: #cfe9ec;
      --accent: #0891b2;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
      margin: 0;
      padding: 64px 24px 96px;
      line-height: 1.6;
    }
    .page {
      max-width: 880px;
      margin: 0 auto;
    }
    header {
      margin-bottom: 56px;
    }
    h1 {
      font-size: 2.4rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin: 0 0 12px;
    }
    .lede {
      color: var(--muted);
      font-size: 1.05rem;
      max-width: 60ch;
      margin: 0;
    }
    .projects {
      display: grid;
      gap: 16px;
    }
    .project-card {
      display: block;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px 24px;
      text-decoration: none;
      color: var(--ink);
      transition: border-color 0.15s ease, transform 0.15s ease;
    }
    .project-card:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }
    .project-number {
      color: var(--accent);
      font-weight: 600;
      font-size: 0.85rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      display: block;
      margin-bottom: 4px;
    }
    .project-title {
      font-size: 1.15rem;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <h1>CS180 Portfolio</h1>
      <p class="lede">Projects</p>
    </header>

    <div class="projects">
      <a class="project-card" href="./1/index.html">
        <span class="project-number">Project 0</span>
        <span class="project-title">Becoming Friends with Your Camera</span>
      </a>
    </div>
  </div>
</body>
</html>
